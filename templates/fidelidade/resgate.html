{% extends 'base.html' %}
{% block content %}
<h2>Resgate — {{ cliente.nome }}</h2>

<div class="alert alert-info">
  Saldo atual: <strong>{{ cliente.saldo_pontos }} pts</strong>.
  Resgatar pontos <strong>reduz</strong> a capacidade de compra futura
  (1 ponto = R$ 1,00).
</div>

<form method="POST">
  <div class="mb-3"><label>Pontos a resgatar</label><input name="pontos" type="number" min="1" class="form-control" required></div>
  <div class="mb-3"><label>Forma de pagamento do resgate</label>
    <select name="forma_pagamento" class="form-control" required>
      <option value="">Selecione...</option>
      {% for f in formas %}<option value="{{ f }}">{{ rotulos[f] }}</option>{% endfor %}
    </select>
  </div>
  <div class="mb-3"><label>Valor equivalente (R$)</label><input name="valor_equivalente" type="number" step="0.01" value="0" class="form-control"></div>
  <div class="mb-3"><label>Observação (obrigatória se produto)</label><textarea name="observacao" class="form-control"></textarea></div>
  <button class="btn btn-success">Confirmar resgate</button>
</form>
{% endblock %}
