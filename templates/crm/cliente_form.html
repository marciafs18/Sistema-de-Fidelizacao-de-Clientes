{% extends 'base.html' %}
{% block content %}
<h2>{% if cliente %}Editar{% else %}Novo{% endif %} Cliente</h2>
<form method="POST">
  <div class="mb-3"><label>Nome</label><input name="nome" class="form-control" value="{{ cliente.nome if cliente else '' }}" required></div>
  {% if not cliente %}
  <div class="mb-3"><label>E-mail (login do cliente)</label><input name="email" type="email" class="form-control" required></div>
  {% endif %}
  <div class="mb-3"><label>Telefone</label><input name="telefone" class="form-control" value="{{ cliente.telefone if cliente else '' }}"></div>
  {% if not cliente %}
  <div class="mb-3"><label>Senha inicial</label><input name="senha_inicial" type="password" class="form-control" required></div>
  <div class="mb-3"><label>Pontos iniciais</label><input name="pontos_iniciais" type="number" value="0" class="form-control"></div>
  {% endif %}
  <button class="btn btn-success">Salvar</button>
</form>
{% endblock %}
