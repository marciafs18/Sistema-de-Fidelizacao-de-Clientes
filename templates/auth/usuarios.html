{% extends 'base.html' %}
{% block content %}
<h2>Usuários (ADM/FUNC)</h2>
<a href="{{ url_for('auth.novo_usuario') }}" class="btn btn-primary mb-3">Novo</a>
<table class="table">
  <tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Ativo</th></tr>
  {% for u in usuarios %}
  <tr><td>{{ u.id }}</td><td>{{ u.nome }}</td><td>{{ u.email }}</td>
      <td>{{ u.perfil }}</td><td>{{ 'Sim' if u.ativo else 'Não' }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
